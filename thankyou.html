<meta charset="UTF-8" />

<title>Thank You — D. Srilakshmi</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0a0f; --surface:#12121a; --card:#181822;
    --text:#f5f5f7; --muted:#9a9aa8; --border:#26262f;
    --accent:#c6ff3d; --accent-2:#7c5cff; --grad:linear-gradient(135deg,#c6ff3d 0%,#7c5cff 100%);
  }
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-.02em;line-height:1.15}
  a{color:inherit;text-decoration:none}
  .container{max-width:1100px;margin:0 auto;padding:0 24px}

  nav{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(14px);background:rgba(10,10,15,.7);border-bottom:1px solid var(--border)}
  .nav-inner{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;max-width:1200px;margin:0 auto}
  .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.1rem}
  .logo span{color:var(--accent)}

  .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;text-align:center;}
  .hero::before{content:"";position:absolute;top:-200px;right:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(124,92,255,.25),transparent 70%);border-radius:50%}
  .hero::after{content:"";position:absolute;bottom:-200px;left:-200px;width:500px;height:500px;background:radial-gradient(circle,rgba(198,255,61,.18),transparent 70%);border-radius:50%}
  .hero-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;}
  
  .hero h1{font-size:clamp(2.8rem,5vw,4.6rem);margin-bottom:18px}
  .hero h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{font-size:1.15rem;color:var(--muted);max-width:560px;margin-bottom:36px}
  
  .btn-primary{background:var(--accent);color:#0a0a0f;padding:14px 28px;border-radius:999px;font-weight:600;transition:transform .2s;display:inline-block}
  .btn-primary:hover{transform:translateY(-2px)}
  
  .success-icon {width:80px;height:80px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:24px;font-size:2rem;color:var(--accent);box-shadow:0 0 30px rgba(198,255,61,.2);}
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->

<nav>
  <div class="nav-inner">
    <div class="logo"><a href="index.html">Srilakshmi<span>.</span></a></div>
  </div>
</nav>

<header class="hero">
  <div class="container hero-inner">
    <div class="success-icon">✓</div>
    <h1>Thank <span class="grad">You!</span></h1>
    <p>Your message has been successfully received. I will review it and get back to you as soon as possible.</p>
    <div>
      <a href="index.html" class="btn-primary">← Return to Portfolio</a>
    </div>
  </div>
</header>

</body>
</html>
